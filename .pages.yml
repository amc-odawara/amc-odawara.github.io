
media:
  input: media/vehicles
  output: /media/vehicles
  rename: safe
  extensions: [jpg, jpeg, png, webp]

content:
  - name: vehicle-list
    label: 販売車両（CAR & BIKE）
    type: file
    path: vehicles.json
    format: json
    list: true
    fields:
      - name: kind
        label: 車両の種類
        type: select
        required: true
        options:
          values:
            - name: car
              label: クルマ
            - name: bike
              label: バイク

      - name: status
        label: 販売状況
        type: select
        required: true
        options:
          values:
            - name: available
              label: 販売中
            - name: negotiating
              label: 商談中
            - name: sold
              label: 売約済（SOLD OUT）

      - name: visible
        label: サイトに表示する
        type: boolean

      - name: sort_order
        label: 表示順（小さい数字が先）
        type: number

      - name: name
        label: 車両名
        type: string
        required: true

      - name: year
        label: 初度登録年・年式
        type: number

      - name: mileage_km
        label: 走行距離（km）
        type: number

      - name: inspection_ja
        label: 車検・自賠責（日本語）
        type: string

      - name: inspection_en
        label: Inspection（English）
        type: string

      - name: price
        label: 車両価格（円）
        type: number

      - name: total_price
        label: 乗り出し参考価格（円）
        type: number

      - name: description_ja
        label: 車両説明（日本語）
        type: text

      - name: description_en
        label: Vehicle description（English）
        type: text

      - name: main_image
        label: メイン写真
        type: image

      - name: gallery_images
        label: 追加写真（最大6枚）
        type: image
        options:
          multiple:
            max: 6
          unique: true

      - name: youtube_url
        label: YouTube動画URL
        type: string

      - name: instagram_url
        label: Instagram投稿URL
        type: string
